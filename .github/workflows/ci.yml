name: EvoNext Full CI Suite

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Install Frontend dependencies
        run: pnpm install

      - name: Run Full Integrity Check
        # If 'pnpm check' triggers cargo test, we ensure it runs with correct flags
        run: pnpm check
        env:
          # This helps some Windows test runners find the correct webview2 targets
          WEBVIEW2_WIN32_PATH: ${{ github.workspace }}/src-tauri/target/debug

      # --- E2E Section ---

      - name: Install Tauri Driver
        run: cargo install tauri-driver

      - name: Build App for E2E
        # Use --no-bundle to skip signing and installer generation
        # Use --debug (implied by no flag, or explicit) to speed up CI
        run: pnpm tauri build --no-bundle

      - name: Run E2E Tests
        env:
          CI: true
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "ubuntu-latest" ]; then
            xvfb-run --auto-servernum pnpm exec wdio run wdio.conf.ts
          else
            pnpm exec wdio run wdio.conf.ts
          fi
