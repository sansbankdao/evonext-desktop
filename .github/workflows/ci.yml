name: EvoNext Full CI Suite

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  guardian:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Install Frontend dependencies
        run: pnpm install

      - name: Run Rust Unit Tests
        # We run --lib specifically to avoid the STATUS_ENTRYPOINT_NOT_FOUND
        # which happens when trying to boot the full Tauri binary in CI
        run: cargo test --manifest-path=./src-tauri/Cargo.toml --lib --no-fail-fast

      - name: Run Type Check
        # This is where your current errors are.
        # Keeping this as a separate step helps isolate Frontend vs Backend failures.
        run: pnpm exec tsc --noEmit

      # --- E2E Section ---

      - name: Install Tauri Driver
        run: cargo install tauri-driver

      - name: Build App for E2E
        # --no-bundle prevents the signing/private key errors
        run: pnpm tauri build --no-bundle

      - name: Run E2E Tests
        env:
          CI: true
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "ubuntu-latest" ]; then
            xvfb-run --auto-servernum pnpm exec wdio run wdio.conf.ts
          else
            pnpm exec wdio run wdio.conf.ts
          fi
