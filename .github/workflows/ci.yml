name: EvoNext Full CI Suite

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  guardian:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xvfb

      - name: Install Frontend dependencies
        run: pnpm install
        env:
          CI: true

      - name: Generate Rust Types
        shell: bash
        run: |
          mkdir -p src/types
          if [ "${{ matrix.platform }}" == "windows-latest" ]; then
            pnpm run type:gen || echo "Warning: Type gen failed"
            touch src/types/rust_generated.ts
          else
            pnpm run type:gen
          fi

      - name: Run Frontend Coverage
        # We run coverage only on Linux to provide a clean, single report
        if: matrix.platform == 'ubuntu-latest'
        run: pnpm exec vitest run --coverage

      - name: Run Rust Unit Tests
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "windows-latest" ]; then
            cargo test --manifest-path=./src-tauri/Cargo.toml --lib --no-run
          else
            pnpm test:rust --no-fail-fast
          fi

      - name: Run Rust Coverage (Tarpaulin)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          cargo install cargo-tarpaulin
          cargo tarpaulin --manifest-path src-tauri/Cargo.toml \
            --out Xml --output-dir ./coverage/rust

      - name: Run Type Check
        run: pnpm exec vue-tsc --noEmit

      - name: Build App for E2E
        run: pnpm tauri build --no-bundle

      - name: Run E2E Tests
        env:
          CI: true
        shell: bash
        run: |
          if [ ! -f "wdio.conf.ts" ]; then
            echo "Error: wdio.conf.ts not found!"
            exit 1
          fi
          if [ "${{ matrix.platform }}" == "ubuntu-latest" ]; then
            xvfb-run --auto-servernum pnpm run test:e2e
          else
            pnpm run test:e2e
          fi

      - name: Upload coverage reports to Codecov
        if: matrix.platform == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: sansbankdao/evonext-desktop
          files: ./coverage/lcov.info,./coverage/rust/tarpaulin.xml
          fail_ci_if_error: true
