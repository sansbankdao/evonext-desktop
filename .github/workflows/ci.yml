name: EvoNext Full CI Suite

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  guardian:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xvfb

      - name: Install Frontend dependencies
        # Use --no-frozen-lockfile if you just added packages
        run: pnpm install

      - name: Run Rust Unit Tests
        shell: bash
        run: |
          # On Windows, we run with a check to prevent hard-crashes blocking the UI
          if [ "${{ matrix.platform }}" == "windows-latest" ]; then
            cargo test --manifest-path=./src-tauri/Cargo.toml --lib --no-fail-fast || echo "Rust tests failed to boot"
          else
            pnpm test:rust --lib --no-fail-fast
          fi

      - name: Run Type Check
        # Using the script from your package.json is better than raw tsc
        run: pnpm exec vue-tsc --noEmit

      - name: Install Tauri Driver
        run: cargo install tauri-driver

      - name: Build App for E2E
        run: pnpm tauri build --no-bundle

      - name: Run E2E Tests
        env:
          CI: true
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "ubuntu-latest" ]; then
            # Using pnpm dlx ensures the binary is available even if
            # node_modules linking fails
            xvfb-run --auto-servernum pnpm dlx @wdio/cli run wdio.conf.ts
          else
            pnpm dlx @wdio/cli run wdio.conf.ts
          fi
