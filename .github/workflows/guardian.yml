name: EvoNext (Desktop) CI Suite

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  guardian:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Clear Cache (Force Rebuild)
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-force-clean
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xvfb

      - name: Install Frontend dependencies
        run: pnpm install
        env:
          CI: true

      - name: Create Placeholder Dist
        run: |
          node -e "const fs = require('fs'); if (!fs.existsSync('dist')) fs.mkdirSync('dist')"

      - name: Fix Webview2 CI (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          # 1. Navigate to the Tauri project directory
          cd src-tauri

          # 2. Clean webview2-com-sys to force a fresh stub generation
          cargo clean -p webview2-com-sys

          # 3. Build it with the stub (don't download the DLL)
          # Set env var BEFORE cargo build
          export WEBVIEW2_COM_SYS_NO_WEBVIEW2=1
          cargo build -p webview2-com-sys

          # 4. Rebuild the entire project with the new stub
          cd ..
          pnpm run build

      - name: Run Rust Unit Tests (Windows)
        if: matrix.platform == 'windows-latest'
        shell: cmd
        env:
          WEBVIEW2_COM_SYS_NO_WEBVIEW2: 1
          # This clears system WebView2 references to prevent PATH conflicts
          PATH: C:\Windows\System32;C:\Windows;C:\Users\runneradmin\.cargo\bin;%PATH%
          # Force linking to ONLY the local stub
          RUSTFLAGS: -C link-args=/NODEFAULTLIB:webview2 /VERBOSE
        run: |
          cd src-tauri
          cargo test --manifest-path=./Cargo.toml --all-features --no-fail-fast

      - name: Run Rust Unit Tests (Unix)
        if: matrix.platform != 'windows-latest'
        run: pnpm run test:rust

      - name: Run Frontend Coverage
        if: matrix.platform == 'ubuntu-latest'
        run: pnpm test

      - name: Run Type Check
        run: pnpm exec vue-tsc --noEmit

      - name: Run E2E Tests
        env:
          CI: true
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "ubuntu-latest" ]; then
            xvfb-run --auto-servernum pnpm run test:e2e
          else
            pnpm run test:e2e
          fi
