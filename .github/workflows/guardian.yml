name: EvoNext (Desktop) CI Suite

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  guardian:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xvfb

      - name: Install Frontend dependencies
        run: pnpm install
        env:
          CI: true

      - name: Build Frontend
        run: pnpm build

      - name: Generate Rust Types
        shell: bash
        run: |
          mkdir -p src/types
          if [ "${{ matrix.platform }}" == "windows-latest" ]; then
            pnpm run type:gen || echo "Warning: Type gen failed"
            touch src/bindings.ts
          else
            pnpm run type:gen
          fi

      - name: Compile Rust (Prepare Binaries)
        run: cargo build --manifest-path ./src-tauri/Cargo.toml --all-features

      - name: Fix Windows DLL Path
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # Locate the WebView2Loader.dll in the build tree and copy it to the deps folder
          # where the test runner looks for it.
          $dll = Get-ChildItem -Path "src-tauri/target/debug" -Filter "WebView2Loader.dll" -Recurse | Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName -Destination "src-tauri/target/debug/deps/"
            echo "Successfully deployed WebView2Loader.dll to deps folder."
          } else {
            echo "Warning: WebView2Loader.dll not found in debug folder."
          }

      - name: Run Frontend Coverage
        if: matrix.platform == 'ubuntu-latest'
        run: pnpm exec vitest run --coverage

      - name: Run Rust Unit Tests
        run: cargo test --manifest-path ./src-tauri/Cargo.toml --all-features

      - name: Run Rust Coverage (Tarpaulin)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          cargo install cargo-tarpaulin
          cargo tarpaulin --manifest-path src-tauri/Cargo.toml \
            --out Xml --output-dir ./coverage/rust

      - name: Run Type Check
        run: pnpm exec vue-tsc --noEmit

      - name: Build App for E2E
        run: pnpm tauri build --no-bundle

      - name: Run E2E Tests
        env:
          CI: true
        shell: bash
        run: |
          if [ ! -f "wdio.conf.ts" ]; then
            echo "Error: wdio.conf.ts not found!"
            exit 1
          fi
          if [ "${{ matrix.platform }}" == "ubuntu-latest" ]; then
            xvfb-run --auto-servernum pnpm run test:e2e
          else
            pnpm run test:e2e
          fi

      - name: Upload coverage reports to Codecov
        if: matrix.platform == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: sansbankdao/evonext-desktop
          files: ./coverage/lcov.info,./coverage/rust/tarpaulin.xml
          fail_ci_if_error: true
