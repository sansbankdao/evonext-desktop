name: EvoNext (Desktop) CI Suite

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardian:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    env:
      WEBVIEW2_LINK_STATIC: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Pin to exact version to match lockfile and avoid drift
          version: 10.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-v2
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Install Frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Placeholder Dist
        shell: bash
        run: mkdir -p dist && touch dist/index.html

      # ── Rust Quality Gates ──────────────────────────────────

      - name: Check Rust Formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy Lint
        working-directory: src-tauri
        run: cargo clippy --all-features --lib -- -D warnings

      # ── Build ───────────────────────────────────────────────

      - name: Generate Types (Specta)
        shell: bash
        run: |
          cd src-tauri
          cargo run --bin export_types

      - name: Build Frontend
        run: pnpm exec vue-tsc --noEmit && pnpm exec vite build

      - name: Build Tauri App
        # Use the Tauri CLI but skip the beforeBuildCommand since
        # we already built the frontend above
        shell: bash
        run: |
          cd src-tauri
          cargo build

      # ── Tests ───────────────────────────────────────────────

      - name: Run Rust Unit Tests (with coverage)
        working-directory: src-tauri
        shell: bash
        run: cargo llvm-cov --all-features --lib --lcov --output-path lcov-rust.info

      - name: Run Frontend Tests
        run: pnpm test

      - name: Run Type Check
        run: pnpm exec vue-tsc --noEmit

      # ── E2E ─────────────────────────────────────────────────

      - name: Run E2E Tests
        continue-on-error: ${{ matrix.platform != 'ubuntu-latest' }}
        env:
          CI: true
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "ubuntu-latest" ]; then
            xvfb-run --auto-servernum pnpm run test:e2e
          else
            pnpm run test:e2e
          fi

      # ── Coverage Upload ─────────────────────────────────────

      - name: Upload Rust Coverage
        if: matrix.platform == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: src-tauri/lcov-rust.info
          flags: rust
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
