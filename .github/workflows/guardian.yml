name: EvoNext (Desktop) CI Suite

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  guardian:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xvfb

      - name: Install Frontend dependencies
        run: pnpm install
        env:
          CI: true

      - name: Create Placeholder Dist
        run: |
          node -e "const fs = require('fs'); if (!fs.existsSync('dist')) fs.mkdirSync('dist')"

      - name: Build and Generate Types
        run: pnpm run build

      - name: Setup Windows WebView2Loader.dll
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          $x64Dll = Get-ChildItem -Path "src-tauri\target" -Recurse -Filter "WebView2Loader.dll" | Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1
          if ($x64Dll) {
            Copy-Item $x64Dll.FullName -Destination "src-tauri\target\debug\deps\WebView2Loader.dll" -Force
          }

      - name: Diagnose Windows test failure
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          # Build tests without running them
          cargo test --manifest-path=./src-tauri/Cargo.toml --all-features --no-run 2>&1

          # Find the actual test binary
          $testExe = Get-ChildItem -Path "src-tauri\target\debug\deps" -Filter "evonext-*.exe" | Where-Object { $_.Name -notmatch "\.d$" } | Select-Object -First 1
          Write-Host "Test binary: $($testExe.FullName)"

          # Use dumpbin to see what DLLs it needs
          Write-Host "`n=== DIRECT DLL DEPENDENCIES ==="
          & dumpbin /dependents $testExe.FullName 2>$null

          # Check which DLLs Windows would actually load
          Write-Host "`n=== Checking each dependency on PATH ==="
          $dumpOutput = & dumpbin /dependents $testExe.FullName 2>$null
          foreach ($line in $dumpOutput) {
            if ($line -match "^\s+(\S+\.dll)\s*$") {
              $dllName = $matches[1]
              $found = & where.exe $dllName 2>$null
              if ($found) {
                Write-Host "${dllName}: $found"
              } else {
                Write-Host "${dllName}: NOT FOUND ON PATH"
              }
            }
          }

          # Try running the test binary directly to capture the real error
          Write-Host "`n=== Attempting direct execution ==="
          $env:RUST_BACKTRACE = "1"
          $proc = Start-Process -FilePath $testExe.FullName -ArgumentList "--list" -Wait -PassThru -NoNewWindow -RedirectStandardOutput "test_stdout.txt" -RedirectStandardError "test_stderr.txt" 2>$null
          Write-Host "Exit code: $($proc.ExitCode)"
          Write-Host "Stdout:"
          if (Test-Path "test_stdout.txt") { Get-Content "test_stdout.txt" }
          Write-Host "Stderr:"
          if (Test-Path "test_stderr.txt") { Get-Content "test_stderr.txt" }

          # Check Windows Event Log for application errors
          Write-Host "`n=== Recent Application Errors ==="
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-5)} -MaxEvents 10 -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "$($_.TimeCreated): $($_.Message)"
          }

          # Check what WebView2Loader.dll exports
          Write-Host "`n=== WebView2Loader.dll exports ==="
          & dumpbin /exports "src-tauri\target\debug\deps\WebView2Loader.dll" 2>$null

          # Check what the test binary imports from WebView2Loader
          Write-Host "`n=== Test binary imports from WebView2Loader ==="
          & dumpbin /imports $testExe.FullName 2>$null | Select-String -Pattern "WebView2" -Context 0,20

      - name: Run Rust Unit Tests
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "windows-latest" ]; then
            cargo test --manifest-path=./src-tauri/Cargo.toml --all-features
          else
            pnpm run test:rust
          fi

      - name: Run Frontend Coverage
        if: matrix.platform == 'ubuntu-latest'
        run: pnpm test

      - name: Run Type Check
        run: pnpm exec vue-tsc --noEmit

      - name: Run E2E Tests
        env:
          CI: true
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "ubuntu-latest" ]; then
            xvfb-run --auto-servernum pnpm run test:e2e
          else
            pnpm run test:e2e
          fi
