name: EvoNext (Desktop) CI Suite

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  guardian:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Clear Rust Cache (Force Webview2 Rebuild)
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-force-clean # Use a unique key to invalidate cache
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xvfb

      - name: Install Frontend dependencies
        run: pnpm install
        env:
          CI: true

      - name: Create Placeholder Dist
        run: |
          node -e "const fs = require('fs'); if (!fs.existsSync('dist')) fs.mkdirSync('dist')"

      - name: Build and Generate Types
        run: pnpm run build

      - name: Force Webview2 Stub Build (Windows Only)
        if: matrix.platform == 'windows-latest'
        run: |
          # 1. Clean ONLY the webview2-com-sys crate to force it to re-download/compile
          cargo clean -p webview2-com-sys

          # 2. Ensure the env var is set for the cargo process
          # This tells webview2-com-sys to compile a stub implementation instead of trying to load the DLL.
          # Since all tests use MockRuntime, they never actually need the real WebView2 DLL.
          export WEBVIEW2_COM_SYS_NO_WEBVIEW2=1

          # 3. Rebuild the crate with the stub
          cargo clean -p webview2-com-sys
          cargo build -p webview2-com-sys

      - name: Run Rust Unit Tests (Windows)
        if: matrix.platform == 'windows-latest'
        shell: cmd
        env:
          WEBVIEW2_COM_SYS_NO_WEBVIEW2: 1
          RUSTFLAGS: "-C link-args=/NODEFAULTLIB:webview2" # Prevent linking to system libs
        run: |
          cargo test --manifest-path=./src-tauri/Cargo.toml --all-features --verbose

      - name: Run Rust Unit Tests (Unix)
        if: matrix.platform != 'windows-latest'
        run: pnpm run test:rust

      - name: Run Frontend Coverage
        if: matrix.platform == 'ubuntu-latest'
        run: pnpm test

      - name: Run Type Check
        run: pnpm exec vue-tsc --noEmit

      - name: Run E2E Tests
        env:
          CI: true
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "ubuntu-latest" ]; then
            xvfb-run --auto-servernum pnpm run test:e2e
          else
            pnpm run test:e2e
          fi
