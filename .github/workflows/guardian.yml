name: EvoNext (Desktop) CI Suite

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  guardian:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xvfb

      - name: Install Frontend dependencies
        run: pnpm install
        env:
          CI: true

      - name: Create Placeholder Dist
        run: |
          node -e "const fs = require('fs'); if (!fs.existsSync('dist')) fs.mkdirSync('dist')"

      - name: Build and Generate Types
        run: pnpm run build

      - name: Locate WebView2Loader.dll for Windows tests
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          # After build, webview2-com-sys has already downloaded the
          # exact matching DLL into a build script output directory.
          $dlls = Get-ChildItem -Path "src-tauri\target" -Recurse -Filter "WebView2Loader.dll" -ErrorAction SilentlyContinue
          if ($dlls.Count -eq 0) {
            Write-Error "WebView2Loader.dll not found in target directory"
            exit 1
          }
          # Pick the first one (they're all the same version from webview2-com-sys)
          $dllDir = $dlls[0].DirectoryName
          Write-Host "Found WebView2Loader.dll at: $dllDir"
          # Add to PATH so the test binary can find it at runtime
          echo "$dllDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # Also copy it next to where the test binary will be
          $debugDir = "src-tauri\target\debug"
          if (Test-Path $debugDir) {
            Copy-Item $dlls[0].FullName -Destination "$debugDir\WebView2Loader.dll" -Force
            Write-Host "Also copied DLL to $debugDir"
          }
          $depsDir = "src-tauri\target\debug\deps"
          if (Test-Path $depsDir) {
            Copy-Item $dlls[0].FullName -Destination "$depsDir\WebView2Loader.dll" -Force
            Write-Host "Also copied DLL to $depsDir"
          }

      - name: Run Rust Unit Tests
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "windows-latest" ]; then
            cargo test --manifest-path=./src-tauri/Cargo.toml --all-features
          else
            pnpm run test:rust
          fi

      - name: Run Frontend Coverage
        if: matrix.platform == 'ubuntu-latest'
        run: pnpm test

      - name: Run Type Check
        run: pnpm exec vue-tsc --noEmit

      - name: Run E2E Tests
        env:
          CI: true
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "ubuntu-latest" ]; then
            xvfb-run --auto-servernum pnpm run test:e2e
          else
            pnpm run test:e2e
          fi
