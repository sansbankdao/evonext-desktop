name: EvoNext (Desktop) CI Suite

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  guardian:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xvfb

      - name: Install Frontend dependencies
        run: pnpm install
        env:
          CI: true

      - name: Build Frontend
        run: pnpm build

      - name: Generate Rust Types
        shell: bash
        run: |
          # This ensures the dist folder exists so the proc-macro doesn't panic
          mkdir -p dist
          pnpm run type:gen

      - name: Run Frontend Coverage
        if: matrix.platform == 'ubuntu-latest'
        run: pnpm exec vitest run --coverage

      - name: Run Rust Unit Tests
        shell: bash
        run: |
          # Standard cargo test works on all platforms for MockRuntime tests.
          # We bypass the 'pnpm tauri' wrapper to avoid CLI versioning conflicts.
          cargo test --manifest-path=./src-tauri/Cargo.toml --all-features

      - name: Run Rust Coverage (Tarpaulin)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          cargo install cargo-tarpaulin
          cargo tarpaulin --manifest-path src-tauri/Cargo.toml \
            --out Xml --output-dir ./coverage/rust

      - name: Run Type Check
        run: pnpm exec vue-tsc --noEmit

      - name: Build App for E2E
        run: pnpm tauri build --no-bundle

      - name: Run E2E Tests
        env:
          CI: true
        shell: bash
        run: |
          if [ ! -f "wdio.conf.ts" ]; then
            echo "Error: wdio.conf.ts not found!"
            exit 1
          fi
          if [ "${{ matrix.platform }}" == "ubuntu-latest" ]; then
            xvfb-run --auto-servernum pnpm run test:e2e
          else
            pnpm run test:e2e
          fi

      - name: Upload coverage reports to Codecov
        if: matrix.platform == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: sansbankdao/evonext-desktop
          files: ./coverage/lcov.info,./coverage/rust/tarpaulin.xml
          fail_ci_if_error: true
