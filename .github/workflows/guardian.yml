name: EvoNext (Desktop) CI Suite

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  guardian:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # We use a specific key for Windows to avoid mixing dynamic/static link artifacts
          key: ${{ runner.os }}-static-link-v1
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xvfb

      - name: Install Frontend dependencies
        run: pnpm install
        env:
          CI: true

      - name: Create Placeholder Dist
        run: |
          node -e "const fs = require('fs'); if (!fs.existsSync('dist')) fs.mkdirSync('dist')"

      - name: Build and Generate Types
        env:
          # Force static linking during the type generation build
          WEBVIEW2_LINK_STATIC: "1"
        run: pnpm run build

      - name: Run Rust Unit Tests
        shell: bash
        env:
          # This is the "Magic Bullet" for Windows Tauri CI.
          # It embeds the WebView2 loader into the test EXE so no DLL is needed.
          WEBVIEW2_LINK_STATIC: "1"
        run: |
          if [ "${{ matrix.platform }}" == "windows-latest" ]; then
            cd src-tauri
            # Force a rebuild of the webview crate with the static flag
            cargo clean -p webview2-com-sys
            cargo test --all-features
          else
            pnpm run test:rust
          fi

      - name: Run Frontend Coverage
        if: matrix.platform == 'ubuntu-latest'
        run: pnpm test

      - name: Run Type Check
        run: pnpm exec vue-tsc --noEmit

      - name: Run E2E Tests
        env:
          CI: true
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "ubuntu-latest" ]; then
            xvfb-run --auto-servernum pnpm run test:e2e
          else
            pnpm run test:e2e
          fi
