name: EvoNext (Desktop) CI Suite

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  guardian:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xvfb

      - name: Install Frontend dependencies
        run: pnpm install
        env:
          CI: true

      - name: Create Placeholder Dist
        run: |
          node -e "const fs = require('fs'); if (!fs.existsSync('dist')) fs.mkdirSync('dist')"

      - name: Build and Generate Types
        run: pnpm run build

      - name: Setup Windows WebView2Loader.dll
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          $x64Dll = Get-ChildItem -Path "src-tauri\target" -Recurse -Filter "WebView2Loader.dll" | Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1
          if ($x64Dll) {
            Copy-Item $x64Dll.FullName -Destination "src-tauri\target\debug\deps\WebView2Loader.dll" -Force
            Write-Host "Copied x64 DLL to deps"
          }

      - name: Diagnose Windows test failure
        if: matrix.platform == 'windows-latest'
        shell: cmd
        run: |
          echo === Building tests without running ===
          cargo test --manifest-path=./src-tauri/Cargo.toml --all-features --no-run

          echo.
          echo === Finding test binary ===
          dir /b src-tauri\target\debug\deps\evonext-*.exe

          echo.
          echo === DIRECT DLL DEPENDENCIES ===
          for %%f in (src-tauri\target\debug\deps\evonext-*.exe) do (
            echo Checking: %%f
            dumpbin /dependents %%f
          )

          echo.
          echo === Checking each dependency on PATH ===
          for %%f in (src-tauri\target\debug\deps\evonext-*.exe) do (
            for /f "tokens=*" %%d in ('dumpbin /dependents %%f ^| findstr /i ".dll"') do (
              where %%d 2>nul && echo FOUND: %%d || echo NOT FOUND: %%d
            )
          )

          echo.
          echo === WebView2Loader.dll exports ===
          dumpbin /exports src-tauri\target\debug\deps\WebView2Loader.dll

          echo.
          echo === Test binary imports from WebView2Loader ===
          for %%f in (src-tauri\target\debug\deps\evonext-*.exe) do (
            dumpbin /imports %%f | findstr /i /c:"WebView2" /c:"CreateCoreWebView" /c:"CompareBrowser" /c:"GetAvailable"
          )

          echo.
          echo === Attempting test --list ===
          for %%f in (src-tauri\target\debug\deps\evonext-*.exe) do (
            echo Running: %%f --list
            %%f --list
            echo Exit code: %ERRORLEVEL%
          )

          echo.
          echo === Recent Application Error Events ===
          wevtutil qe Application /c:5 /f:text /q:"*[System[Level=2 and TimeCreated[timediff(@SystemTime) <= 300000]]]" 2>nul

      - name: Run Rust Unit Tests
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "windows-latest" ]; then
            cargo test --manifest-path=./src-tauri/Cargo.toml --all-features
          else
            pnpm run test:rust
          fi

      - name: Run Frontend Coverage
        if: matrix.platform == 'ubuntu-latest'
        run: pnpm test

      - name: Run Type Check
        run: pnpm exec vue-tsc --noEmit

      - name: Run E2E Tests
        env:
          CI: true
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "ubuntu-latest" ]; then
            xvfb-run --auto-servernum pnpm run test:e2e
          else
            pnpm run test:e2e
          fi
