name: EvoNext (Desktop) CI Suite

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  guardian:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xvfb

      - name: Install Frontend dependencies
        run: pnpm install
        env:
          CI: true

      - name: Create Placeholder Dist
        run: mkdir -p dist

      - name: Build and Generate Types
        run: pnpm run build

      - name: Setup Windows DLLs
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          $Webview2Version = "1.0.2903.40"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$Webview2Version" -OutFile "webview2.zip"
          Expand-Archive -Path "webview2.zip" -DestinationPath "webview2"
          $dllPath = "webview2/build/native/x64/WebView2Loader.dll"
          # Create target directories for both standard cargo and llvm-cov
          New-Item -ItemType Directory -Force -Path "src-tauri/target/debug/deps"
          Copy-Item $dllPath -Destination "src-tauri/target/debug/"
          Copy-Item $dllPath -Destination "src-tauri/target/debug/deps/"
          Write-Host "✅ WebView2Loader.dll injected into target directories"

      - name: Run Rust Unit Tests
        run: pnpm run test:rust

      - name: Run Frontend Coverage
        if: matrix.platform == 'ubuntu-latest'
        run: pnpm test

      - name: Run Type Check
        run: pnpm exec vue-tsc --noEmit

      - name: Run E2E Tests
        env:
          CI: true
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "ubuntu-latest" ]; then
            xvfb-run --auto-servernum pnpm run test:e2e
          else
            pnpm run test:e2e
          fi
