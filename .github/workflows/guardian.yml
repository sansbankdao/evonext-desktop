name: EvoNext (Desktop) CI Suite

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  guardian:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xvfb

      - name: Install Frontend dependencies
        run: pnpm install
        env:
          CI: true

      - name: Create Placeholder Dist
        run: |
          node -e "const fs = require('fs'); if (!fs.existsSync('dist')) fs.mkdirSync('dist')"

      - name: Build and Generate Types
        run: pnpm run build

      - name: Locate x64 WebView2Loader.dll for Windows tests
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          # List ALL WebView2Loader.dll variants so we can see what's available
          Write-Host "=== All WebView2Loader.dll in target ==="
          Get-ChildItem -Path "src-tauri\target" -Recurse -Filter "WebView2Loader.dll" | ForEach-Object {
            Write-Host "  $($_.FullName) [$($_.Length) bytes]"
          }

          # Find specifically the x64 variant (path contains \x64\)
          $x64Dlls = Get-ChildItem -Path "src-tauri\target" -Recurse -Filter "WebView2Loader.dll" -ErrorAction SilentlyContinue | Where-Object {
            $_.FullName -match "\\x64\\" -or $_.FullName -match "[/]x64[/]"
          }

          if ($x64Dlls.Count -eq 0) {
            Write-Error "x64 WebView2Loader.dll not found in target directory"
            Write-Host "This runner's architecture: $env:PROCESSOR_ARCHITECTURE"
            exit 1
          }

          $dll = $x64Dlls[0]
          Write-Host "`nUsing x64 DLL: $($dll.FullName) [$($dll.Length) bytes]"

          # Copy next to the test binary and its deps
          Copy-Item $dll.FullName -Destination "src-tauri\target\debug\WebView2Loader.dll" -Force
          Write-Host "Copied to src-tauri\target\debug\"

          Copy-Item $dll.FullName -Destination "src-tauri\target\debug\deps\WebView2Loader.dll" -Force
          Write-Host "Copied to src-tauri\target\debug\deps\"

          # Also add to PATH as a fallback
          echo "$($dll.DirectoryName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Added $($dll.DirectoryName) to PATH"

      - name: Run Rust Unit Tests
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "windows-latest" ]; then
            cargo test --manifest-path=./src-tauri/Cargo.toml --all-features
          else
            pnpm run test:rust
          fi

      - name: Run Frontend Coverage
        if: matrix.platform == 'ubuntu-latest'
        run: pnpm test

      - name: Run Type Check
        run: pnpm exec vue-tsc --noEmit

      - name: Run E2E Tests
        env:
          CI: true
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "ubuntu-latest" ]; then
            xvfb-run --auto-servernum pnpm run test:e2e
          else
            pnpm run test:e2e
          fi
