name: 'Release EvoNext Desktop Edition'

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            LICENSE.md
            README.md
          body_path: CHANGELOG.md

  build-linux-ubuntu-2004:
    needs: create-release
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          # Set noninteractive mode and timezone to avoid prompts
          export DEBIAN_FRONTEND=noninteractive
          export TZ=America/New_York

          # Preconfigure timezone
          ln -fs /usr/share/zoneinfo/America/New_York /etc/localtime

          # Update package list first
          echo "=== Updating package list ==="
          apt-get update

          # Install tzdata first to avoid interactive prompts later
          echo "=== Installing tzdata ==="
          apt-get install -y --no-install-recommends tzdata

      - name: Install Basic Tools
        run: |
          echo "=== Installing basic tools ==="
          apt-get install -y --no-install-recommends \
            curl \
            wget \
            lsb-release \
            ca-certificates \
            software-properties-common

          echo "=== Ubuntu Version ==="
          lsb_release -a

      - name: Install Build Essentials
        run: |
          echo "=== Installing build essentials ==="
          apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            cmake

      - name: Install GLib and GTK Dependencies
        run: |
          echo "=== Installing GLib and GTK dependencies ==="
          apt-get install -y --no-install-recommends \
            libglib2.0-dev \
            libgtk-3-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf2.0-dev \
            libharfbuzz-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Install WebKitGTK Dependencies
        run: |
          echo "=== Installing WebKitGTK dependencies ==="
          apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-dev \
            libsoup2.4-dev \
            libjavascriptcoregtk-4.0-dev

      - name: Install Additional Tauri Dependencies
        run: |
          echo "=== Installing additional Tauri dependencies ==="
          apt-get install -y --no-install-recommends \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libdbus-1-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxtst-dev \
            libxi-dev

      - name: Try Install Ayatana (Optional)
        run: |
          echo "=== Trying to install ayatana (optional) ==="
          apt-get install -y --no-install-recommends libayatana-appindicator3-dev 2>/dev/null || \
            echo "libayatana-appindicator3-dev not available, skipping..."

      - name: Clean Up APT Cache
        run: |
          echo "=== Cleaning up ==="
          apt-get clean
          rm -rf /var/lib/apt/lists/*

      - name: Verify Installed Dependencies
        run: |
          echo "=== Verifying installed dependencies ==="
          dpkg -l | grep -E "(glib|gtk|webkit|appindicator|rsvg|cairo|pango|atk|ssl)" | grep "^ii" || true

          echo "=== Checking pkg-config files ==="
          find /usr -name "*.pc" | grep -E "(glib|gtk|webkit)" | head -10 || true

          echo "=== Testing pkg-config ==="
          pkg-config --modversion glib-2.0 || echo "WARNING: glib-2.0 not found via pkg-config"
          pkg-config --modversion gtk+-3.0 || echo "WARNING: gtk+-3.0 not found via pkg-config"
          pkg-config --modversion webkit2gtk-4.0 || echo "WARNING: webkit2gtk-4.0 not found via pkg-config"

      - name: Install Node.js 20
        run: |
          echo "=== Installing Node.js 20 ==="
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"

      - name: Install Rust and Cargo
        run: |
          echo "=== Installing Rust ==="
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

          # Load cargo into PATH
          source "$HOME/.cargo/env"

          # Set up Rust
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu

          # Verify installation
          echo "Rust version: $(rustc --version)"
          echo "Cargo version: $(cargo --version)"
          echo "Cargo path: $(which cargo)"

          # Save to environment for later steps
          echo "CARGO_BIN=$HOME/.cargo/bin" >> $GITHUB_ENV
          echo "PATH=$HOME/.cargo/bin:$PATH" >> $GITHUB_ENV

      - name: Install pnpm
        run: |
          echo "=== Installing pnpm ==="
          npm install -g pnpm@8
          echo "pnpm version: $(pnpm --version)"

      - name: Install frontend dependencies
        run: |
          echo "=== Installing frontend dependencies ==="
          pnpm install

      - name: Verify Build Tools
        run: |
          echo "=== Verifying build tools ==="
          which cargo && echo "✓ cargo found: $(cargo --version)"
          which rustc && echo "✓ rustc found: $(rustc --version)"
          which node && echo "✓ node found: $(node --version)"
          which pnpm && echo "✓ pnpm found: $(pnpm --version)"
          which tauri || echo "✗ tauri not found (will be run via pnpm)"

          echo "=== PKG_CONFIG_PATH ==="
          echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"

          echo "=== Testing pkg-config again ==="
          pkg-config --modversion glib-2.0 && echo "✓ glib-2.0 found"
          pkg-config --modversion gtk+-3.0 && echo "✓ gtk+-3.0 found"
          pkg-config --modversion webkit2gtk-4.0 && echo "✓ webkit2gtk-4.0 found" || echo "✗ webkit2gtk-4.0 not found"

      - name: Build Tauri Application
        run: |
          echo "=== Building Tauri application ==="
          echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"
          echo "PATH: $PATH"
          echo "Cargo location: $(which cargo)"

          # Set PKG_CONFIG_PATH explicitly
          export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:${PKG_CONFIG_PATH:-}
          echo "Final PKG_CONFIG_PATH: $PKG_CONFIG_PATH"

          # Test pkg-config one more time
          pkg-config --modversion glib-2.0 || exit 1

          # Build
          pnpm tauri build --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PATH: ${{ env.PATH }}:${{ env.CARGO_BIN }}
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig

      - name: Upload Linux Artifacts to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

      - name: Debug on Failure
        if: failure()
        run: |
          echo "=== DEBUG: Build failed, showing diagnostic info ==="
          echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"
          echo "PATH: $PATH"
          which cargo || echo "cargo not found"
          pkg-config --modversion glib-2.0 || echo "glib-2.0 not found"
          pkg-config --modversion gtk+-3.0 || echo "gtk+-3.0 not found"
          find /usr -name "glib-2.0.pc" 2>/dev/null || echo "No glib-2.0.pc found"
          find /usr -name "*.pc" | grep -i glib || echo "No glib pc files found"
          dpkg -l | grep glib || echo "No glib packages installed"

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install x86_64-apple-darwin target for Universal Binaries
        run: rustup target add x86_64-apple-darwin
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Install frontend dependencies
        run: pnpm install
      - name: Build Universal macOS App
        run: pnpm tauri build --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload macOS Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Install frontend dependencies
        run: pnpm install
      - name: Build Application
        run: pnpm tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux-ubuntu-2004, build-macos, build-windows]
    steps:
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
