name: 'Release EvoNext Desktop Edition'

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            LICENSE.md
            README.md
          body_path: CHANGELOG.md

  build-linux-ubuntu-2004:
    needs: create-release
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Debug step to see what's available
      - name: Debug - Find Exact Package Names
        if: ${{ always() }}
        run: |
          echo "=== System Information ==="
          lsb_release -a
          uname -a

          echo "=== Available WebKitGTK packages ==="
          apt-cache search webkit | grep -E "(webkit|webkit2gtk)" | sort

          echo "=== Available GTK development packages ==="
          apt-cache search 'libgtk-3' | grep dev | sort

          echo "=== Available libappindicator packages ==="
          apt-cache search appindicator | grep -E "(dev|lib)" | sort

          echo "=== Available libayatana packages ==="
          apt-cache search ayatana | grep -E "(dev|lib)" | sort

      - name: Update APT and Install System Dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            curl \
            wget \
            build-essential \
            # Tauri 2.4.0 dependencies for Ubuntu 20.04
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            patchelf \
            pkg-config \
            ca-certificates \
            gnupg \
            lsb-release \
            software-properties-common

      # Verify installation
      - name: Verify Dependencies
        run: |
          echo "=== Checking installed packages ==="
          dpkg -l | grep -E "(webkit|gtk|appindicator|ayatana|rsvg)" | grep -E "ii|hi"
          echo "=== Checking pkg-config paths ==="
          pkg-config --cflags --libs webkit2gtk-4.0 || echo "WebKit2GTK not found via pkg-config"
          pkg-config --cflags --libs gtk+-3.0 || echo "GTK+3 not found via pkg-config"

      - name: Install Node.js 20
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "export PATH=$HOME/.cargo/bin:$PATH" >> ~/.bashrc
          . ~/.bashrc
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu

      - name: Install pnpm
        run: npm install -g pnpm@8

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri Application
        run: pnpm tauri build --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Linux Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install x86_64-apple-darwin target for Universal Binaries
        run: rustup target add x86_64-apple-darwin
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Install frontend dependencies
        run: pnpm install
      - name: Build Universal macOS App
        run: pnpm tauri build --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload macOS Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Install frontend dependencies
        run: pnpm install
      - name: Build Application
        run: pnpm tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux-ubuntu-2004, build-macos, build-windows]
    steps:
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
