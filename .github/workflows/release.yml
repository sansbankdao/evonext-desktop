name: 'Release EvoNext Desktop Edition'

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            LICENSE.md
            README.md
          body_path: CHANGELOG.md

  build-linux-ubuntu-2004:
    needs: create-release
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies for Tauri 2.4.0
        run: |
          # Set noninteractive mode and timezone to avoid prompts
          export DEBIAN_FRONTEND=noninteractive
          export TZ=America/New_York

          # Preconfigure timezone
          ln -fs /usr/share/zoneinfo/America/New_York /etc/localtime

          # Update package list first
          apt-get update

          # Install tzdata first to avoid interactive prompts later
          apt-get install -y --no-install-recommends tzdata

          # Install pkg-config early (needed for GLib detection)
          apt-get install -y --no-install-recommends pkg-config

          # Install basic tools
          apt-get install -y --no-install-recommends curl wget lsb-release ca-certificates

          echo "=== Building on Ubuntu Version ==="
          lsb_release -a

          # Install Tauri dependencies for Ubuntu 20.04
          # GLib development files are CRITICAL for glib-sys crate
          apt-get install -y --no-install-recommends \
            build-essential \
            # GTK/GLib dependencies
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            # SSL/TLS
            libssl-dev \
            libssl1.1 \
            # System libraries
            libcairo2-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf2.0-dev \
            # Patching tool for AppImage bundling
            patchelf \
            # Additional WebKit dependencies
            libsoup2.4-dev \
            libjavascriptcoregtk-4.0-dev

          # Try to install ayatana (may not exist in 20.04, that's okay)
          apt-get install -y --no-install-recommends libayatana-appindicator3-dev 2>/dev/null || \
            echo "Note: libayatana-appindicator3-dev not available, continuing..."

          # Set PKG_CONFIG_PATH for GLib
          echo "=== Setting PKG_CONFIG_PATH ==="
          export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:$PKG_CONFIG_PATH
          echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> $GITHUB_ENV

          # Verify pkg-config can find glib-2.0
          echo "=== Verifying pkg-config can find glib-2.0 ==="
          pkg-config --modversion glib-2.0 || echo "Warning: glib-2.0 not found via pkg-config"
          pkg-config --modversion gtk+-3.0 || echo "Warning: gtk+-3.0 not found via pkg-config"
          pkg-config --modversion webkit2gtk-4.0 || echo "Warning: webkit2gtk-4.0 not found via pkg-config"

          # Clean up to reduce image size
          apt-get clean
          rm -rf /var/lib/apt/lists/*

          # Verify key dependencies are installed
          echo "=== Verifying key dependencies ==="
          dpkg -l | grep -E "(glib|gtk|webkit|appindicator|rsvg|cairo|pango|atk)" | grep ii || true

      - name: Install Node.js 20
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          echo "Node.js version:"
          node --version

      - name: Install Rust and Cargo with Proper PATH
        run: |
          # Install Rust using rustup
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

          # Load cargo into PATH for this step
          source "$HOME/.cargo/env"

          # Set up Rust
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu

          # Verify installation
          echo "Rust version: $(rustc --version)"
          echo "Cargo version: $(cargo --version)"
          echo "Cargo path: $(which cargo)"

          # Add cargo to PATH for subsequent steps
          echo "CARGO_BIN=$HOME/.cargo/bin" >> $GITHUB_ENV
          echo "PATH=$HOME/.cargo/bin:$PATH" >> $GITHUB_ENV

      - name: Install pnpm
        run: |
          npm install -g pnpm@8
          echo "pnpm version: $(pnpm --version)"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Verify Build Environment
        run: |
          echo "=== Verifying all build tools are in PATH ==="
          which cargo || echo "cargo not found"
          which rustc || echo "rustc not found"
          which node || echo "node not found"
          which pnpm || echo "pnpm not found"
          which tauri || echo "tauri not found"

          echo "=== Verifying pkg-config setup ==="
          pkg-config --list-all | grep -E "(glib|gtk|webkit)" || echo "No GLib/GTK packages found via pkg-config"

          echo "PATH: $PATH"
          echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"

      - name: Build Tauri Application
        run: |
          # Debug: Show cargo location and pkg-config setup
          echo "Cargo location: $(which cargo)"
          echo "Cargo version: $(cargo --version)"
          echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"

          # Test pkg-config
          echo "=== Testing pkg-config ==="
          pkg-config --modversion glib-2.0 || echo "ERROR: glib-2.0 not found"
          pkg-config --modversion gtk+-3.0 || echo "ERROR: gtk+-3.0 not found"
          pkg-config --modversion webkit2gtk-4.0 || echo "ERROR: webkit2gtk-4.0 not found"

          # Build with pnpm
          echo "=== Starting Tauri build ==="
          pnpm tauri build --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PATH: ${{ env.PATH }}:${{ env.CARGO_BIN }}
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:$PKG_CONFIG_PATH

      - name: Upload Linux Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install x86_64-apple-darwin target for Universal Binaries
        run: rustup target add x86_64-apple-darwin
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Install frontend dependencies
        run: pnpm install
      - name: Build Universal macOS App
        run: pnpm tauri build --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload macOS Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Install frontend dependencies
        run: pnpm install
      - name: Build Application
        run: pnpm tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux-ubuntu-2004, build-macos, build-windows]
    steps:
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
