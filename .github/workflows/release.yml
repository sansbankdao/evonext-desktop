name: 'Release EvoNext Desktop Edition'

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            LICENSE.md
            README.md
          body_path: CHANGELOG.md

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          export TZ=America/New_York
          ln -fs /usr/share/zoneinfo/America/New_York /etc/localtime
          apt-get update
          apt-get install -y --no-install-recommends tzdata

      - name: Install Dependencies
        run: |
          echo "=== Installing Tauri dependencies for Ubuntu 22.04 ==="
          apt-get install -y --no-install-recommends \
            curl wget build-essential pkg-config ca-certificates \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libcairo2-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf2.0-dev \
            libsoup-3.0-dev \
            xdg-utils \
            file \
            desktop-file-utils \
            libfuse2

      - name: Install Node.js 20
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          echo "Node.js $(node --version)"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu
          rustc --version
          cargo --version
          echo "CARGO_BIN=$HOME/.cargo/bin" >> $GITHUB_ENV
          echo "PATH=$HOME/.cargo/bin:$PATH" >> $GITHUB_ENV

      - name: Install pnpm
        run: |
          npm install -g pnpm@8
          pnpm --version

      - name: Clean previous builds
        run: |
          rm -rf src-tauri/target || true
          rm -rf node_modules/.vite || true
          rm -rf src/types/rust_generated.ts || true
          rm -rf src-tauri/src/types/rust_generated.ts || true
          pnpm store prune

      - name: Ensure types directory (root)
        run: mkdir -p src/types

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Build export_types binary
        run: |
          cd src-tauri
          cargo build --bin export_types --release
          cd ..

      - name: Generate Rust Types (The Bridge)
        run: |
          # Run directly from root for correct cwd
          cd src-tauri && cargo run --bin export_types --release
          cd ..
        env:
          CI: true

      # If pnpm type:gen does more (e.g., validation), run it after; otherwise, remove this
      - name: Run pnpm type:gen if needed
        run: pnpm type:gen --verbose
        if: always()
        env:
          CI: true

      - name: Build Tauri Application
        run: pnpm tauri build --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PATH: ${{ env.PATH }}:${{ env.CARGO_BIN }}
          CI: true

      - name: Upload Linux Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install targets for Universal Binaries
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Clean previous builds
        run: |
          rm -rf src-tauri/target || true
          rm -rf node_modules/.vite || true
          rm -rf src/types/rust_generated.ts || true
          rm -rf src-tauri/src/types/rust_generated.ts || true
          pnpm store prune
      - name: Ensure types directory (root)
        run: mkdir -p src/types
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true
      - name: Build export_types binary
        run: |
          cd src-tauri
          cargo build --bin export_types --release
          cd ..
      - name: Generate Rust Types (The Bridge)
        run: |
          # Run directly from root for correct cwd
          cd src-tauri && cargo run --bin export_types --release
          cd ..
        env:
          CI: true
      - name: Run pnpm type:gen if needed
        run: pnpm type:gen --verbose
        if: always()
        env:
          CI: true
      - name: Build Tauri Application
        run: pnpm tauri build --target universal-apple-darwin --verbose
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: true
      - name: Upload macOS Artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install target
        run: rustup target add x86_64-pc-windows-msvc
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Clean previous builds
        run: |
          if (Test-Path src-tauri\target) { Remove-Item -Recurse -Force src-tauri\target }
          if (Test-Path node_modules\.vite) { Remove-Item -Recurse -Force node_modules\.vite }
          if (Test-Path src\types\rust_generated.ts) { Remove-Item src\types\rust_generated.ts }
          if (Test-Path src-tauri\src\types\rust_generated.ts) { Remove-Item src-tauri\src\types\rust_generated.ts }
          pnpm store prune
        shell: powershell
      - name: Ensure types directory (root)
        run: New-Item -ItemType Directory -Force -Path src\types
        shell: powershell
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true
      - name: Build export_types binary
        run: |
          cd src-tauri
          cargo build --bin export_types --release
          cd ..
        shell: powershell
      - name: Generate Rust Types (The Bridge)
        run: |
          # Run directly from root for correct cwd (PowerShell handles cd)
          Push-Location src-tauri
          cargo run --bin export_types --release
          Pop-Location
        shell: powershell
        env:
          CI: true
      - name: Run pnpm type:gen if needed
        run: pnpm type:gen --verbose
        if: always()
        env:
          CI: true
      # Workaround: If reader expects src-tauri/src/types/, copy it
      - name: Copy types for compatibility (remove after fixing reader)
        run: |
          if (Test-Path src\types\rust_generated.ts) {
            New-Item -ItemType Directory -Force -Path src-tauri\src\types
            Copy-Item src\types\rust_generated.ts src-tauri\src\types\
          }
        shell: powershell
        if: always()
      - name: Build Application
        run: pnpm tauri build --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NODE_OPTIONS: --max-old-space-size=4096
          CI: true
      - name: Upload Windows Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    steps:
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
