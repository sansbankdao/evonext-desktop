name: 'Release EvoNext Desktop Edition'

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            LICENSE.md
            README.md
          body_path: CHANGELOG.md

  build-linux-ubuntu-2204:
    needs: create-release
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          export TZ=America/New_York
          ln -fs /usr/share/zoneinfo/America/New_York /etc/localtime
          apt-get update
          apt-get install -y --no-install-recommends tzdata

      - name: Install Basic Tools
        run: |
          apt-get install -y --no-install-recommends curl wget build-essential pkg-config ca-certificates gnupg lsb-release software-properties-common

      - name: Check Packages Are Available
        run: |
          echo "=== Checking Ubuntu Version ==="
          lsb_release -a
          echo "=== Checking if packages exist ==="
          apt-cache show libwebkit2gtk-4.1-dev > /dev/null 2>&1 && echo "✓ libwebkit2gtk-4.1-dev available" || echo "✗ libwebkit2gtk-4.1-dev NOT available"
          apt-cache show libglib2.0-dev > /dev/null 2>&1 && echo "✓ libglib2.0-dev available" || echo "✗ libglib2.0-dev NOT available"

      - name: Install Tauri Dependencies
        run: |
          echo "=== Installing all Tauri dependencies ==="
          # All on one line to avoid parsing issues
          apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libglib2.0-dev libgtk-3-dev libappindicator3-dev librsvg2-dev libssl-dev patchelf libcairo2-dev libpango1.0-dev libatk1.0-dev libgdk-pixbuf2.0-dev libsoup-3.0-dev

      - name: Install Optional Ayatana
        run: |
          echo "=== Installing optional packages ==="
          apt-get install -y --no-install-recommends libayatana-appindicator3-dev 2>/dev/null || echo "libayatana-appindicator3-dev not available, continuing..."

      - name: Clean Up
        run: |
          apt-get clean
          rm -rf /var/lib/apt/lists/*

      - name: Install Node.js 20
        run: |
          echo "=== Installing Node.js 20 ==="
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          echo "Node.js $(node --version)"
          echo "npm $(npm --version)"

      - name: Install Rust
        run: |
          echo "=== Installing Rust ==="
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu
          echo "Rust $(rustc --version)"
          echo "Cargo $(cargo --version)"
          echo "CARGO_BIN=$HOME/.cargo/bin" >> $GITHUB_ENV
          echo "PATH=$HOME/.cargo/bin:$PATH" >> $GITHUB_ENV

      - name: Install pnpm
        run: |
          echo "=== Installing pnpm ==="
          npm install -g pnpm@8
          echo "pnpm $(pnpm --version)"

      - name: Install frontend dependencies
        run: |
          echo "=== Installing frontend dependencies ==="
          pnpm install

      - name: Verify Build Environment
        run: |
          echo "=== Verifying build environment ==="
          which cargo && echo "✓ cargo found"
          which rustc && echo "✓ rustc found"
          which node && echo "✓ node found"
          which pnpm && echo "✓ pnpm found"

          echo "=== Checking critical libraries ==="
          pkg-config --modversion glib-2.0 && echo "✓ glib-2.0 found" || echo "✗ glib-2.0 NOT found"
          pkg-config --modversion gtk+-3.0 && echo "✓ gtk+-3.0 found" || echo "✗ gtk+-3.0 NOT found"
          pkg-config --modversion webkit2gtk-4.1 && echo "✓ webkit2gtk-4.1 found" || echo "✗ webkit2gtk-4.1 NOT found"
          pkg-config --modversion javascriptcoregtk-4.1 && echo "✓ javascriptcoregtk-4.1 found" || echo "✗ javascriptcoregtk-4.1 NOT found"

      - name: Build Tauri Application
        run: |
          echo "=== Building Tauri application ==="
          echo "Environment:"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-not set}"
          echo "PATH: $PATH"

          # Set PKG_CONFIG_PATH if not already set
          export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:${PKG_CONFIG_PATH:-}
          echo "Using PKG_CONFIG_PATH: $PKG_CONFIG_PATH"

          # Build
          pnpm tauri build --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PATH: ${{ env.PATH }}:${{ env.CARGO_BIN }}

      - name: Upload Linux Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install x86_64-apple-darwin target for Universal Binaries
        run: rustup target add x86_64-apple-darwin
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Install frontend dependencies
        run: pnpm install
      - name: Build Universal macOS App
        run: pnpm tauri build --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload macOS Artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Install frontend dependencies
        run: pnpm install
      - name: Build Application
        run: pnpm tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload Windows Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux-ubuntu-2204, build-macos, build-windows]
    steps:
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
