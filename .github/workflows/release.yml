name: 'Release EvoNext Desktop Edition'

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            LICENSE.md
            README.md
          body_path: CHANGELOG.md

  build-linux-debian-11:
    needs: create-release
    runs-on: ubuntu-latest
    container:
      image: debian:bullseye
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Debian Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          export TZ=America/New_York
          ln -fs /usr/share/zoneinfo/America/New_York /etc/localtime
          apt-get update
          apt-get install -y --no-install-recommends tzdata

      - name: Install Dependencies
        run: |
          echo "=== Installing dependencies for Debian Bullseye ==="
          echo "Debian version:"
          cat /etc/debian_version

          # Update and install basic tools
          apt-get update
          apt-get install -y --no-install-recommends curl wget build-essential pkg-config ca-certificates gnupg lsb-release software-properties-common

          # Install ALL Tauri dependencies in one command
          apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev libglib2.0-dev libgtk-3-dev libappindicator3-dev librsvg2-dev libssl-dev patchelf libcairo2-dev libpango1.0-dev libatk1.0-dev libgdk-pixbuf2.0-dev libsoup2.4-dev

          # Install xdg-utils for AppImage bundling
          apt-get install -y --no-install-recommends xdg-utils file desktop-file-utils libfuse2

          # Try to install ayatana (optional)
          apt-get install -y --no-install-recommends libayatana-appindicator3-dev 2>/dev/null || echo "libayatana-appindicator3-dev not available"

      - name: Install Node.js 20
        run: |
          echo "=== Installing Node.js 20 ==="
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          echo "Node.js $(node --version)"

      - name: Install Rust
        run: |
          echo "=== Installing Rust ==="
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu
          echo "Rust $(rustc --version)"
          echo "Cargo $(cargo --version)"
          echo "CARGO_BIN=$HOME/.cargo/bin" >> $GITHUB_ENV
          echo "PATH=$HOME/.cargo/bin:$PATH" >> $GITHUB_ENV

      - name: Install pnpm
        run: |
          npm install -g pnpm@8
          echo "pnpm $(pnpm --version)"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Verify Dependencies
        run: |
          echo "=== Verifying dependencies ==="
          which xdg-open && echo "✓ xdg-open found"

          echo "=== Checking library versions ==="
          pkg-config --modversion glib-2.0 && echo "✓ GLib version: $(pkg-config --modversion glib-2.0)"
          pkg-config --modversion gtk+-3.0 && echo "✓ GTK version: $(pkg-config --modversion gtk+-3.0)"

          # Check WebKit version - might be 4.0 or not found
          if pkg-config --exists webkit2gtk-4.0; then
            echo "✓ WebKit2GTK 4.0 version: $(pkg-config --modversion webkit2gtk-4.0)"
          elif pkg-config --exists webkit2gtk-4.1; then
            echo "✓ WebKit2GTK 4.1 version: $(pkg-config --modversion webkit2gtk-4.1)"
          else
            echo "✗ WebKit2GTK not found via pkg-config"
          fi

      - name: Build Tauri Application (Try with WebKit 4.0)
        id: build-debian
        continue-on-error: true
        run: |
          echo "=== Building Tauri on Debian Bullseye ==="
          echo "Trying with WebKit2GTK 4.0 (Debian Bullseye default)"

          # Force pkg-config to find WebKit 4.0
          export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"

          pnpm tauri build --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PATH: ${{ env.PATH }}:${{ env.CARGO_BIN }}

      - name: Fallback to Ubuntu 22.04 if Debian Fails
        if: steps.build-debian.outcome == 'failure'
        uses: addnab/docker-run-action@v3
        with:
          image: ubuntu:22.04
          options: -v ${{ github.workspace }}:/workspace -w /workspace --privileged
          shell: bash
          run: |
            echo "=== Debian 11 failed, falling back to Ubuntu 22.04 ==="

            # Setup
            export DEBIAN_FRONTEND=noninteractive
            export TZ=America/New_York
            ln -fs /usr/share/zoneinfo/America/New_York /etc/localtime

            apt-get update
            apt-get install -y --no-install-recommends tzdata

            # Install Ubuntu 22.04 dependencies (WebKit 4.1)
            apt-get install -y --no-install-recommends \
              curl wget build-essential pkg-config ca-certificates \
              libwebkit2gtk-4.1-dev \
              libjavascriptcoregtk-4.1-dev \
              libglib2.0-dev \
              libgtk-3-dev \
              libappindicator3-dev \
              librsvg2-dev \
              libssl-dev \
              patchelf \
              libcairo2-dev \
              libpango1.0-dev \
              libatk1.0-dev \
              libgdk-pixbuf2.0-dev \
              libsoup-3.0-dev \
              xdg-utils \
              file \
              desktop-file-utils \
              libfuse2

            # Install Node.js
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y nodejs
            npm install -g pnpm@8

            # Install Rust
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source "$HOME/.cargo/env"
            rustup default stable
            rustup target add x86_64-unknown-linux-gnu

            # Install dependencies and build
            cd /workspace
            pnpm install
            pnpm tauri build --verbose

            # Move artifacts to workspace
            mkdir -p /workspace/debian-fallback-artifacts
            cp -r src-tauri/target/release/bundle/* /workspace/debian-fallback-artifacts/

      - name: Upload Linux Artifacts from Debian
        if: steps.build-debian.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

      - name: Upload Linux Artifacts from Ubuntu Fallback
        if: steps.build-debian.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            debian-fallback-artifacts/appimage/*.AppImage
            debian-fallback-artifacts/deb/*.deb
            debian-fallback-artifacts/rpm/*.rpm

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install x86_64-apple-darwin target for Universal Binaries
        run: rustup target add x86_64-apple-darwin
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Install frontend dependencies
        run: pnpm install
      - name: Build Universal macOS App
        run: pnpm tauri build --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload macOS Artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Install frontend dependencies
        run: pnpm install
      - name: Build Application
        run: pnpm tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload Windows Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux-debian-11, build-macos, build-windows]
    steps:
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
