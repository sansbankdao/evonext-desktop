name: 'Release EvoNext Desktop Edition'

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            LICENSE.md
            README.md
          body_path: CHANGELOG.md

  build-linux-ubuntu-2004:
    needs: create-release
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          export TZ=America/New_York
          ln -fs /usr/share/zoneinfo/America/New_York /etc/localtime

          apt-get update
          apt-get install -y --no-install-recommends tzdata

      - name: Install System Dependencies (Single Line)
        run: |
          echo "=== Installing all dependencies in one command ==="
          apt-get install -y --no-install-recommends curl wget build-essential autoconf automake libtool pkg-config cmake ninja-build git ca-certificates libffi-dev libmount-dev libpcre3-dev zlib1g-dev libselinux1-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev libssl-dev libgtk-3-dev patchelf libcairo2-dev libpango1.0-dev libatk1.0-dev libgdk-pixbuf2.0-dev libsoup2.4-dev libjavascriptcoregtk-4.0-dev

      - name: Install Python and Meson
        run: |
          echo "=== Installing Python and Meson ==="
          apt-get install -y --no-install-recommends python3 python3-pip python3-setuptools
          pip3 install meson

      - name: Build and Install GLib 2.70+ from Source
        run: |
          echo "=== Building GLib 2.70+ from source ==="

          # Download GLib 2.70.0
          cd /tmp
          wget https://download.gnome.org/sources/glib/2.70/glib-2.70.0.tar.xz
          tar -xf glib-2.70.0.tar.xz
          cd glib-2.70.0

          # Configure and build
          meson setup _build --prefix=/usr/local --libdir=lib -Dselinux=disabled -Dman=false
          ninja -C _build
          ninja -C _build install

          # Update ldconfig
          ldconfig

          # Verify installation
          echo "=== Verifying GLib installation ==="
          pkg-config --modversion glib-2.0

      - name: Clean Up Build Files
        run: |
          rm -rf /tmp/glib-*

      - name: Install Node.js 20
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          echo "Node.js version:"
          node --version

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu
          echo "Rust version:"
          rustc --version
          echo "CARGO_BIN=$HOME/.cargo/bin" >> $GITHUB_ENV
          echo "PATH=$HOME/.cargo/bin:$PATH" >> $GITHUB_ENV

      - name: Install pnpm
        run: |
          npm install -g pnpm@8
          echo "pnpm version:"
          pnpm --version

      - name: Install frontend dependencies
        run: pnpm install

      - name: Set PKG_CONFIG_PATH for Custom GLib
        run: |
          echo "=== Setting PKG_CONFIG_PATH ==="
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:$PKG_CONFIG_PATH
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> $GITHUB_ENV

          # Verify GLib is found
          echo "=== Verifying custom GLib ==="
          pkg-config --modversion glib-2.0 || echo "ERROR: GLib not found!"
          pkg-config --libs glib-2.0 || echo "ERROR: Cannot get GLib libs!"

      - name: Build Tauri Application
        run: |
          echo "=== Building Tauri application ==="
          echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"
          echo "Using GLib version:"
          pkg-config --modversion glib-2.0 || exit 1

          # Build with custom PKG_CONFIG_PATH
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig \
          pnpm tauri build --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PATH: ${{ env.PATH }}:${{ env.CARGO_BIN }}
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          LD_LIBRARY_PATH: /usr/local/lib

      - name: Upload Linux Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install x86_64-apple-darwin target for Universal Binaries
        run: rustup target add x86_64-apple-darwin
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Install frontend dependencies
        run: pnpm install
      - name: Build Universal macOS App
        run: pnpm tauri build --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload macOS Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Install frontend dependencies
        run: pnpm install
      - name: Build Application
        run: pnpm tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux-ubuntu-2004, build-macos, build-windows]
    steps:
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
