# src-tauri/Cargo.toml

[package]
name = "evonext"
version = "26.9.21"
description = "Free and Fearless Social — Connect with early-stage Founders and Creators — plus, the hottest collection of Mini Apps designed to streamline your workflow and simplify everyday tasks."
authors = ["Sansbank DAO developers"]
edition = "2021"
build = "build.rs"
default-run = "evonext"

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
# System
chrono = { version = "0.4.43", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.4.0", features = ["tray-icon", "image-png", "test"] }
tauri-plugin-dialog = { version = "2.6.0" }

# Deep links (`dash:` payment URIs). The app already EMITS `dash:` URIs as
# QR codes (src/screens/identity/Register.vue, src/screens/Bootstrap.vue) but
# could not previously RECEIVE them: clicking one in a browser or another app
# did nothing.
#
# PINNED TO 2.4.5 ON PURPOSE. 2.4.9+ declares `@tauri-apps/api: ^2.11.0` and
# `tauri = "2.10"`; this repo pins @tauri-apps/api 2.10.1 and tauri 2.4.0.
# 2.4.7/2.4.8 still require tauri 2.10 (only the npm side is relaxed).
#
# NOTE: there is deliberately NO tauri-plugin-single-instance. Multiple
#       instances are supported by design, so on Linux/Windows the OS starts
#       a NEW process with the URL as its only CLI argument and that process
#       reads it via `get_current()`. Nothing is forwarded to an existing
#       window.
tauri-plugin-deep-link = { version = "=2.4.5" }
tauri-plugin-fs = { version = "2.4.5" }
tauri-plugin-opener = { version = "2.5.3" }
tauri-plugin-shell = { version = "2.3.4" }
tauri-plugin-store = { version = "2.4.2" }
tauri-plugin-updater = { version = "2.4.0" }

# DAPI / RPC
lazy_static = "1.4"
rusqlite = { version = "0.40", features = ["bundled"] }
lru_time_cache = "0.11"
regex = "1.10"
futures = "0.3"
reqwest = { version = "0.13.1", features = ["blocking", "json"] }
thiserror = "2.0.18"
tokio = { version = "1.47", features = ["full", "test-util"] }
tower = { version = "0.5.3", features = ["limit", "load-shed", "util"] }
tracing = "0.1"

# Realtime (WebSocket) client for the `wss://evonext.app/ws` notification hub.
# Gated behind the `realtime` feature so a from-source build can omit the
# whole socket stack — see [features] below.
#
# `rustls-tls-webpki-roots` is used instead of `native-tls` so TLS does not
# depend on the host's OpenSSL. That matters for the reproducible
# cross-platform release pipeline (Linux builds run inside evobuild:22.04 and
# Windows is cross-compiled via cargo-xwin), where a system-CA build would
# differ per machine.
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"], optional = true }

# Direct rustls dependency so the process-wide CryptoProvider can be installed
# explicitly at startup.
#
# WHY THIS IS REQUIRED, NOT OPTIONAL
# ----------------------------------
# rustls 0.23 removed the implicit provider default: if more than one provider
# crate is compiled in it cannot pick one and `ClientConfig::builder()` PANICS
# with "Could not automatically determine the process-level CryptoProvider".
# Both providers are present here — reqwest pulls `aws-lc-rs` (via
# default-tls -> hyper-rustls) and tauri-plugin-updater pulls `ring`. The
# panic fires on the FIRST WebSocket handshake, which is exactly the path the
# realtime client takes, so without this the socket would panic in production
# rather than merely fail.
#
# `aws-lc-rs` is selected because reqwest already compiles it, so choosing it
# adds no new native build step to the release pipeline. The version tracks
# tokio-tungstenite's own rustls.
rustls = { version = "0.23.36", default-features = false, features = ["std", "aws-lc-rs"] }

# Crypto
sha2 = "0.10"
rand = "0.9.2"
ripemd = "0.1"
bitcoin = "0.32.8"
# secp256k1 ECDSA for Dash Signed Message (src/crypto/signed_message.rs).
# Required as a real dependency, not dev-only: push registration signs with
# k256 server-side-verified ECDSA. sha2 above provides the double-SHA256.
k256 = { version = "0.13", features = ["ecdsa"] }

# Utilities
base64 = "0.22.1"
hex = "0.4.3"

# Error reporting (see src/sentry/mod.rs for the full rationale).
#
# WHY THE VERSIONS ARE COUPLED. `tauri-plugin-sentry` 0.5 pins `sentry ^0.42`,
# so the previously-declared `sentry = "0.46.1"` did not merely sit in two
# copies — it failed to compile:
#
#   error[E0308]: mismatched types
#     expected `&Client`, found `&ClientInitGuard`
#
# `init()` returned a 0.46 `ClientInitGuard` while the plugin wanted a `&Client`
# from the 0.42 crate. Both sides move together: plugin 0.6 for `sentry 0.49`.
# That also collapses the duplicate crates (0.42 + 0.46) to a single 0.49.
#
# WHY default-features = false + rustls. `sentry`'s default set includes
# `transport`, and `transport = ["reqwest", "native-tls"]`. That pulled:
#
#   openssl-sys <- native-tls <- hyper-tls <- reqwest 0.12 <- sentry 0.46.2
#
# which violates the rustls-only rule stated below for the release pipeline
# (Linux builds in evobuild:22.04, Windows via cargo-xwin must not depend on a
# per-machine OpenSSL). Building with `rustls` instead REMOVES that chain; the
# features below re-add the default set minus `transport`/`debug-images`,
# which minidump relies on.
#
# WHY minidump IS OFF. The plugin's default feature is `minidump`, and it is
# disabled here on purpose:
#   1. It does not resolve: sentry-rust-minidump 0.17 -> minidumper 0.10 ->
#      minidump-writer 0.12 -> `error-graph`, which is not on crates.io.
#   2. It is unsafe for this app: the vault documents the keystore as an
#      in-memory plain buffer, so the mnemonic is resident while running, and
#      what a minidump captures by default is UNVERIFIED. AGENTS.md forbids
#      exporting sensitive material; see src/sentry/mod.rs before enabling.
sentry = { version = "0.49", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "release-health",
    "rustls",
    "reqwest",
] }
tauri-plugin-sentry = { version = "0.6", default-features = false }

# Anti-Regression Suite (Specta v2 Unified)
specta = { version = "2.0.0-rc.22", features = ["derive", "serde", "serde_json", "chrono"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "2.0.0-rc.21", features = ["typescript"] }

# Encrypted-at-rest keystore (see src/vault/mod.rs). iota_stronghold pinned
# EXACTLY: the engine is dormant (last release 2024-05-13) — revisit on
# upgrades; iota-crypto provides secp256k1 prehash signing for
# vault::procedures::DashEcdsaPrehashSign (its [lib] name is "crypto").
iota_stronghold = "=2.1.0"
iota-crypto = { version = "0.23", features = ["secp256k1"] }
keyring = "4.2"
zeroize = "1"
tauri-plugin-notification = { version = "2.4.0" }

[dev-dependencies]
ctor = "0.2"
mockito = "1.7.2"
tempfile = "3"
sha2 = "0.10"
# NOTE: The integration tests build a mock Tauri app whose plugin store
# resolves to the SAME real app-data directory for every test. Two tests
# (`test_settings_full_lifecycle` and `test_settings_command_wrapper_generic`)
# both read and write `settings.json` there, so under the default parallel
# test runner they interleave and one sees the other's data. `serial_test`
# lets those two opt out of parallelism without changing their logic.
serial_test = "4.0.1"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Realtime WebSocket notifications (wss://evonext.app/ws). OFF by default:
# a plain `cargo build` compiles no socket code, needs no network stack, and
# produces the same binary as before. Enable with `--features realtime`.
realtime = ["dep:tokio-tungstenite"]

[[bin]]
name = "evonext"
path = "src/main.rs"

[[bin]]
name = "export_types"
path = "src/export_types.rs"

[package.metadata.cargo-llvm-cov]
# Ignore files that don't contain testable logic
ignore-filename-regex = "(main|export_types|lib)\\.rs$"
