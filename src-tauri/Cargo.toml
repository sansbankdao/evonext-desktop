# src-tauri/Cargo.toml

[package]
name = "evonext"
version = "26.1.1"
description = "Free and Fearless — Discover safe spaces to Explore. Curate. Share YOUR Truth — secured by Dash Platform."
authors = ["Sansbank DAO developers"]
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.4.0", features = ["tray-icon", "image-png"] }
# tauri-plugin-http = { version = "2.4.0" }
tauri-plugin-opener = { version = "2.4.0" }
tauri-plugin-store = { version = "2.4.0" }
tauri-plugin-updater = { version = "2.4.0" }
tauri-plugin-dialog = { version = "2.4.0" }
tauri-plugin-shell = { version = "2.3.3" } # latest v2.3.3
tauri-plugin-fs = { version = "2.4.0" }

# New Dependencies for DAPI Integration
lazy_static = "1.4"
lru_time_cache = "0.11"
regex = "1.10"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
thiserror = "1.0"
tokio = { version = "1.47", features = ["full"] }
tower = { version = "0.4", features = ["limit", "load-shed", "util"] }
tracing = "0.1"
ts-rs = { version = "11", features = ["serde-compat"] }

base64 = "0.22.1"
hex = "0.4.3"
sha2 = "0.10"
ripemd = "0.1"
bitcoin = "0.32.8"

[features]
# This section is used for custom features. You can leave it as is.
custom-protocol = ["tauri/custom-protocol"]
