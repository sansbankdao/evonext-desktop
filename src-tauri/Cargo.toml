# src-tauri/Cargo.toml

[package]
name = "evonext"
version = "26.1.24"
description = "Free and Fearless Social — Connect with early-stage Founders and Creators — plus, the hottest collection of Mini Apps designed to streamline your workflow and simplify everyday tasks."
authors = ["Sansbank DAO developers"]
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
# System
chrono = { version = "0.4.43", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.4.0", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = { version = "2.6.0" }
tauri-plugin-fs = { version = "2.4.5" }
tauri-plugin-opener = { version = "2.5.3" }
tauri-plugin-shell = { version = "2.3.4" }
tauri-plugin-store = { version = "2.4.2" }
tauri-plugin-updater = { version = "2.4.0" }

# DAPI (RPC) Integration
lazy_static = "1.4"
lru_time_cache = "0.11"
regex = "1.10"
reqwest = { version = "0.13.1", features = ["blocking", "json"] }
thiserror = "2.0.18"
tokio = { version = "1.47", features = ["full", "test-util"] }
tower = { version = "0.5.3", features = ["limit", "load-shed", "util"] }
tracing = "0.1"
ts-rs = { version = "11", features = ["serde-compat"] }

# Crypto
sha2 = "0.10"
ripemd = "0.1"
bitcoin = "0.32.8"

# Utilities
base64 = "0.22.1"
hex = "0.4.3"

# Debugging
sentry = "0.46.1"
tauri-plugin-sentry = "0.5"

[features]
# This section is used for custom features. You can leave it as is.
custom-protocol = ["tauri/custom-protocol"]
